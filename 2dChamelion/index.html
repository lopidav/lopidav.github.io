<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mecha Chameleon</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: sans-serif; background-color: #1e1e1e; color: #fff; padding: 20px; margin: 0; }
        .panel { background: #2d2d2d; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .flex { display: flex; gap: 20px; }
        input, button { padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #555; background: #111; color: #fff; width: 90%; }
        button { background: #007bff; border: none; cursor: pointer; font-weight: bold; width: auto; }
        button:hover { background: #0056b3; }
        input:disabled { opacity: 0.6; cursor: not-allowed; }
        label { display: block; margin-top: 10px; font-size: 14px; color: #ccc; }
        
        .player-list { list-style: none; padding: 0; margin: 0 0 15px 0; max-height: 150px; overflow-y: auto; }
        .player-list li { padding: 5px; background: #222; margin-bottom: 5px; border-radius: 3px; display: flex; justify-content: space-between; }
        .host-badge { color: #ffeb3b; font-size: 12px; font-weight: bold; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
</head>
<body>
    <div id="app-root"></div>
    <script type="module" src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Event & Timer Dashboard</title>
  <link rel="icon" href="icon.png" type="image/png">
  <style>
    :root {
      --bg: #12131C;
      --card-bg: #1E202E;
      --accent: #6C5CE7;
      --accent-hover: #5A4BD1;
      --text: #E0E6ED;
      --subtext: #94A3B8;
      --border: #2D3142;
      --active: #00B894;
      --off: #4A5568;
      --danger: #E74C3C;
      --danger-hover: #C0392B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; max-width: 1200px; margin: 0 auto; }
    h1 { margin-bottom: 20px; font-size: 1.8rem; color: #FFF; text-align: center; }
    
    .top-bar { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
    .vol-control { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 250px; }
    .vol-control label { color: var(--subtext); font-size: 0.85rem; font-weight: bold; text-transform: uppercase; white-space: nowrap; }
    .vol-control input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
    .vol-value { font-weight: bold; min-width: 40px; font-size: 0.9rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-bottom: 30px; }
    
    /* Base Card Styling */
    .card { 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 16px; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      position: relative; 
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    
    /* OFF Card State - Muted background, but Title & Mode Toggles stay crisp */
    .card.off {
      background: rgba(18, 20, 29, 0.85);
      border-color: #232635;
    }
    .card.off .timer-display { color: var(--off) !important; opacity: 0.7; }
    .card.off .controls, 
    .card.off .btn-group, 
    .card.off .interval-badge {
      opacity: 0.5;
    }
    .card.off .card-header, 
    .card.off .mode-group {
      opacity: 1 !important;
      filter: none !important;
    }

    /* Expired Card State - Red tint background, Title & Mode Toggles stay crisp */
    .card.expired {
      background: rgba(231, 76, 60, 0.12);
      border-color: rgba(231, 76, 60, 0.6);
      box-shadow: inset 0 0 15px rgba(231, 76, 60, 0.15);
    }
    .card.expired .timer-display { color: var(--danger) !important; }
    .card.expired .card-header, 
    .card.expired .mode-group {
      opacity: 1 !important;
      filter: none !important;
    }

    /* Big Plus Creation Card */
    .card.create-card { 
      border: 2px dashed var(--border); 
      background: rgba(30, 32, 46, 0.4); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 250px; 
      cursor: pointer; 
    }
    .card.create-card:hover { border-color: var(--accent); background: rgba(108, 92, 231, 0.08); }
    .plus-icon { font-size: 3.5rem; color: var(--subtext); line-height: 1; font-weight: 300; }
    .card.create-card:hover .plus-icon { color: var(--accent); }
    .create-label { font-size: 0.95rem; font-weight: 600; color: var(--subtext); margin-top: 8px; }

    .card-header { display: flex; align-items: center; gap: 10px; }
    .icon-placeholder { width: 36px; height: 36px; background: var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
    .card-title { font-size: 1.1rem; font-weight: 600; flex: 1; color: #FFF; }
    
    .title-input { background: transparent; border: 1px solid transparent; color: #FFF; font-size: 1.1rem; font-weight: 600; width: 100%; border-radius: 4px; padding: 2px 4px; }
    .title-input:hover, .title-input:focus { border-color: var(--border); background: var(--bg); }
    
    .interval-badge { font-size: 0.75rem; color: var(--subtext); padding: 4px 8px; display: inline-block; width: fit-content; }

    .btn-delete { background: transparent; border: none; color: var(--subtext); cursor: pointer; font-size: 1.1rem; padding: 2px 6px; border-radius: 4px; }
    .btn-delete:hover { color: var(--danger); background: rgba(231, 76, 60, 0.1); }
    
    .timer-display { font-size: 1.6rem; font-family: monospace; font-weight: bold; color: var(--active); text-align: center; margin: 2px 0; transition: color 0.3s ease; }
    
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.85rem; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    label { color: var(--subtext); font-size: 0.75rem; text-transform: uppercase; font-weight: 600; }
    
    input, select, button { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; outline: none; }
    button { background: var(--accent); cursor: pointer; font-weight: 600; border: none; }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: var(--border); }
    button.danger { background: var(--danger); }
    button.danger:hover { background: var(--danger-hover); }
    
    .mode-group { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px; gap: 2px; }
    .mode-btn { flex: 1; background: transparent; color: var(--subtext); border: none; padding: 6px 4px; font-size: 0.75rem; font-weight: bold; border-radius: 4px; cursor: pointer; text-align: center; }
    .mode-btn:hover { background: rgba(255,255,255,0.05); }
    .mode-btn.active { background: var(--accent); color: #FFF; }
    .mode-btn.active.mode-off { background: var(--off); color: #FFF; }
    
    .btn-group { display: flex; gap: 6px; }
    .btn-group button { flex: 1; }
    
    .section-title { font-size: 1.3rem; margin: 24px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 10px; max-width: 400px; width: 90%; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

    .log-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; max-height: 250px; overflow-y: auto; }
    .log-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .log-item:last-child { border-bottom: none; }
    .log-title { font-weight: 600; color: #FFF; }
    .log-time { color: var(--subtext); font-family: monospace; font-size: 0.8rem; }
  </style>
</head>
<body>

  <h1>Game Event & Crafting Reminders</h1>

  <div class="top-bar">
    <div class="vol-control">
      <label for="masterVolume">🔊 Volume</label>
      <input type="range" id="masterVolume" min="0" max="1" step="0.05" value="0.7" oninput="setMasterVolume(this.value)">
      <span class="vol-value" id="volVal">70%</span>
    </div>
    <button onclick="testNextSound()">Test Sound: <span id="testSoundName">Chime</span></button>
  </div>

  <div class="section-title">Fixed Periodic Events</div>
  <div class="grid" id="periodic-container"></div>

  <div class="section-title">Countdown & Craft Timers</div>
  <div class="grid" id="countdown-container"></div>

  <div class="section-title">
    Triggered Reminders Log
    <button class="secondary" style="font-size:0.8rem; padding: 4px 8px;" onclick="clearLogs()">Clear Log</button>
  </div>
  <div class="log-container" id="log-list"></div>

  <div id="deleteModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <h3 style="color:#FFF;">Confirm Deletion</h3>
      <p id="deleteModalText" style="color:var(--subtext);">Are you sure you want to delete this reminder?</p>
      <div class="modal-actions">
        <button class="secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

<script>
// Time Helper Functions
function parseTimeToSeconds(str) {
  if (typeof str === 'number') return str;
  if (str === null || str === undefined) return null;
  const trimmed = String(str).trim();
  if (trimmed === '') return null;

  const isNegative = trimmed.startsWith('-');
  let cleanStr = trimmed.replace('-', '').trim().toLowerCase();

  let totalSec = 0;
  if (cleanStr.includes(':')) {
    const parts = cleanStr.split(':').map(p => parseInt(p, 10) || 0);
    if (parts.length === 3) totalSec = parts[0] * 3600 + parts[1] * 60 + parts[2];
    else if (parts.length === 2) totalSec = parts[0] * 60 + parts[1];
  } else {
    const hMatch = cleanStr.match(/(\d+)\s*(h|hr|hours?)/);
    const mMatch = cleanStr.match(/(\d+)\s*(m|min|minutes?)/);
    const sMatch = cleanStr.match(/(\d+)\s*(s|sec|seconds?)/);

    if (hMatch || mMatch || sMatch) {
      let hours = hMatch ? parseInt(hMatch[1], 10) : 0;
      let mins = mMatch ? parseInt(mMatch[1], 10) : 0;
      let secs = sMatch ? parseInt(sMatch[1], 10) : 0;
      totalSec = hours * 3600 + mins * 60 + secs;
    } else {
      const num = parseInt(cleanStr, 10);
      if (isNaN(num)) return null;
      totalSec = num;
    }
  }

  return isNegative ? -totalSec : totalSec;
}

function secondsToHms(sec) {
  const isNeg = sec < 0;
  sec = Math.abs(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const prefix = isNeg ? '-' : '';
  
  return `${prefix}${h.toString().padStart(2, '0')}h ${m.toString().padStart(2, '0')}m ${s.toString().padStart(2, '0')}s`;
}

// Master Volume & Sound Synthesizer
let masterVolume = parseFloat(localStorage.getItem('g_volume')) || 0.7;
document.getElementById('masterVolume').value = masterVolume;
document.getElementById('volVal').textContent = Math.round(masterVolume * 100) + '%';

function setMasterVolume(val) {
  masterVolume = parseFloat(val);
  document.getElementById('volVal').textContent = Math.round(masterVolume * 100) + '%';
  localStorage.setItem('g_volume', masterVolume);
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (masterVolume <= 0) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'chime') {
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
  } else if (type === 'alarm') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.setValueAtTime(400, audioCtx.currentTime + 0.15);
  } else {
    osc.type = 'square';
    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
  }

  gain.gain.setValueAtTime(0.3 * masterVolume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);
}

const soundsList = ['chime', 'alarm', 'pulse'];
let soundTestIdx = 0;
function testNextSound() {
  const currentSound = soundsList[soundTestIdx];
  playSound(currentSound);
  document.getElementById('testSoundName').textContent = currentSound.charAt(0).toUpperCase() + currentSound.slice(1);
  soundTestIdx = (soundTestIdx + 1) % soundsList.length;
}

// Activity Log
let logs = JSON.parse(localStorage.getItem('g_logs')) || [];

function addLogEntry(title) {
  const timeStr = new Date().toLocaleTimeString();
  const dateStr = new Date().toLocaleDateString();
  logs.unshift({ time: `${dateStr} ${timeStr}`, title });
  if (logs.length > 50) logs.pop();
  localStorage.setItem('g_logs', JSON.stringify(logs));
  renderLogs();
}

function renderLogs() {
  const container = document.getElementById('log-list');
  if (!container) return;
  if (logs.length === 0) {
    container.innerHTML = `<div style="color:var(--subtext); text-align:center; padding:16px;">No triggered reminders logged yet.</div>`;
    return;
  }
  container.innerHTML = logs.map(l => `
    <div class="log-item">
      <span class="log-title">${l.title}</span>
      <span class="log-time">${l.time}</span>
    </div>
  `).join('');
}

function clearLogs() {
  logs = [];
  localStorage.setItem('g_logs', JSON.stringify(logs));
  renderLogs();
}

function triggerAlert(timer, title) {
  if (timer.mode !== 'off') {
    addLogEntry(`${timer.name} - ${title}`);
    playSound(timer.soundId || 'chime');
  }
  if (timer.mode === 'push' && "Notification" in window && Notification.permission === "granted") {
    try {
      new Notification(timer.name, { body: title, icon: timer.icon || 'icon.png' });
    } catch (e) {
      console.error(e);
    }
  }
}

// Default Timers Setup
const defaultPeriodic = [
  { id: 'p_weather', name: 'Weather Change', type: '15m', offsetSec: 0, mode: 'off', soundId: 'chime', lastTrigger: 0 },
  { id: 'p_raid', name: 'KOH', type: '30m', offsetSec: 0, mode: 'off', soundId: 'chime', lastTrigger: 0 },
  { id: 'p_black_market', name: 'Black Market', type: '1h', offsetSec: 0, mode: 'off', soundId: 'chime', lastTrigger: 0 },
  { id: 'p_quest', name: 'Quest Refresh', type: 'daily_00_gmt', offsetSec: 0, mode: 'off', soundId: 'alarm', lastTrigger: 0 },
  { id: 'p_admin', name: 'Update (Admin Abuse)', type: 'sat_18_gmt', offsetSec: 0, mode: 'off', soundId: 'alarm', lastTrigger: 0 },
  { id: 'p_clan_quest', name: 'Clan Quest Refresh', type: 'mon_00_gmt', offsetSec: 0, mode: 'off', soundId: 'chime', lastTrigger: 0 },
  { id: 'p_prices', name: 'Market Price', type: '3m', offsetSec: 0, mode: 'off', soundId: 'chime', lastTrigger: 0 },
  { id: 'p_prices_rich', name: 'Market Price Refresh (with businessman)', type: '2m45s', offsetSec: 0, mode: 'off', soundId: 'chime', lastTrigger: 0 },
];

const defaultCountdowns = [
  { id: 'c_daily', name: 'Daily Reward', totalSec: 86400, remainingSec: 86400, lastEdit: Date.now(), isPaused: true, mode: 'off', soundId: 'chime' },
  { id: 'c_craft36', name: 'Crafting 36h', totalSec: 129600*0.9, remainingSec: 129600*0.9, lastEdit: Date.now(), isPaused: true, mode: 'off', soundId: 'chime' },
  { id: 'c_craft24', name: 'Crafting 24h', totalSec: 86400*0.9, remainingSec: 86400*0.9, lastEdit: Date.now(), isPaused: true, mode: 'off', soundId: 'chime' },
  { id: 'c_craft12', name: 'Crafting 12h', totalSec: 43200*0.9, remainingSec: 43200*0.9, lastEdit: Date.now(), isPaused: true, mode: 'off', soundId: 'chime' },
];

let state = {
  periodic: JSON.parse(localStorage.getItem('g_periodic')) || defaultPeriodic,
  countdowns: JSON.parse(localStorage.getItem('g_countdowns')) || defaultCountdowns
};

function saveState() {
  localStorage.setItem('g_periodic', JSON.stringify(state.periodic));
  localStorage.setItem('g_countdowns', JSON.stringify(state.countdowns));
}

function getIntervalText(type) {
  if (type === '3m') return 'Interval: Every 3m';
  if (type === '2m45s') return 'Interval: Every 2m 45s';
  if (type === '15m') return 'Interval: Every 15m';
  if (type === '30m') return 'Interval: Every 30m';
  if (type === '1h') return 'Interval: Every 1h';
  if (type === 'daily_00_gmt') return 'Interval: Daily @ 00:00 GMT';
  if (type === 'sat_18_gmt') return 'Interval: Weekly Sat 18:00 GMT';
  if (type === 'mon_00_gmt') return 'Interval: Weekly Mon 00:00 GMT';
  
  const sec = typeof type === 'number' ? type : parseTimeToSeconds(type);
  return `Interval: Every ${secondsToHms(sec)}`;
}

// Precise Periodic Math Engine
function getIntervalMs(type) {
  if (type === '2m45s') return 2 * 60 * 1000 + 45 * 1000;
  if (type === '3m') return 3 * 60 * 1000;
  if (type === '15m') return 15 * 60 * 1000;
  if (type === '15m') return 15 * 60 * 1000;
  if (type === '30m') return 30 * 60 * 1000;
  if (type === '1h') return 60 * 60 * 1000;
  if (typeof type === 'number') return type * 1000;
  const parsed = parseTimeToSeconds(type);
  return (parsed && parsed > 0) ? parsed * 1000 : 15 * 60 * 1000;
}

function getLatestCalendarBoundary(type, targetMs) {
  const d = new Date(targetMs);
  if (type === 'daily_00_gmt') {
    d.setUTCHours(0, 0, 0, 0);
    if (d.getTime() > targetMs) d.setUTCDate(d.getUTCDate() - 1);
    return d.getTime();
  }
  if (type === 'sat_18_gmt') {
    d.setUTCHours(18, 0, 0, 0);
    while (d.getUTCDay() !== 6 || d.getTime() > targetMs) {
      d.setUTCDate(d.getUTCDate() - 1);
    }
    return d.getTime();
  }
  if (type === 'mon_00_gmt') {
    d.setUTCHours(0, 0, 0, 0);
    while (d.getUTCDay() !== 1 || d.getTime() > targetMs) {
      d.setUTCDate(d.getUTCDate() - 1);
    }
    return d.getTime();
  }
  return targetMs;
}

function getNextCalendarBoundary(type, currentBoundaryMs) {
  const d = new Date(currentBoundaryMs + 1000);
  if (type === 'daily_00_gmt') {
    d.setUTCHours(0, 0, 0, 0);
    while (d.getTime() <= currentBoundaryMs) d.setUTCDate(d.getUTCDate() + 1);
    return d.getTime();
  }
  if (type === 'sat_18_gmt') {
    d.setUTCHours(18, 0, 0, 0);
    while (d.getUTCDay() !== 6 || d.getTime() <= currentBoundaryMs) {
      d.setUTCDate(d.getUTCDate() + 1);
    }
    return d.getTime();
  }
  if (type === 'mon_00_gmt') {
    d.setUTCHours(0, 0, 0, 0);
    while (d.getUTCDay() !== 1 || d.getTime() <= currentBoundaryMs) {
      d.setUTCDate(d.getUTCDate() + 1);
    }
    return d.getTime();
  }
  return currentBoundaryMs + 86400000;
}

function getPeriodicTargetAndDiff(item, now) {
  const offsetMs = (item.offsetSec || 0) * 1000;
  const targetTime = now - offsetMs;
  const isCalendar = ['daily_00_gmt', 'sat_18_gmt', 'mon_00_gmt'].includes(item.type);

  let E, E_next;
  if (isCalendar) {
    E = getLatestCalendarBoundary(item.type, targetTime);
    E_next = getNextCalendarBoundary(item.type, E);
  } else {
    const I = getIntervalMs(item.type);
    E = Math.floor(targetTime / I) * I;
    E_next = E + I;
  }

  const A = E + offsetMs;
  const A_next = E_next + offsetMs;

  return { E, A, E_next, A_next };
}

function formatTime(ms) {
  if (ms < 0) ms = 0;
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

// Page Load Sync
function syncPeriodicOnLoad() {
  const now = Date.now();
  state.periodic.forEach(item => {
    const { E } = getPeriodicTargetAndDiff(item, now);
    if (item.lastTrigger < E) {
      item.lastTrigger = E;
    }
  });
  saveState();
}

function checkOfflineCountdownsOnLoad() {
  const now = Date.now();
  let changed = false;

  state.countdowns.forEach(item => {
    if (!item.isPaused && item.remainingSec > 0) {
      const elapsed = Math.floor((now - item.lastEdit) / 1000);
      if (elapsed >= item.remainingSec) {
        item.remainingSec = 0;
        item.isPaused = true;
        triggerAlert(item, `Timer Completed (while offline)!`);
        changed = true;
      }
    }
  });

  if (changed) saveState();
}

function setMode(id, category, mode) {
  const list = state[category];
  const item = list.find(x => x.id === id);
  if (!item) return;

  if (mode === 'push') {
    if ("Notification" in window) {
      if (Notification.permission !== "granted") {
        Notification.requestPermission().then(perm => {
          if (perm === "granted") {
            applyModeChange(item, id, category, 'push');
          } else {
            alert("Notification permission denied. Reverting to Sound mode.");
            applyModeChange(item, id, category, 'sound');
          }
        });
        return;
      }
    } else {
      alert("This browser does not support notifications. Switching to Sound mode.");
      mode = 'sound';
    }
  }
  applyModeChange(item, id, category, mode);
}

function applyModeChange(item, id, category, mode) {
  item.mode = mode;
  saveState();
  const group = document.getElementById(`mode-group-${id}`);
  if (group) {
    group.querySelectorAll('.mode-btn').forEach(btn => {
      const isTarget = btn.dataset.mode === mode;
      btn.classList.toggle('active', isTarget);
      btn.classList.toggle('mode-off', isTarget && mode === 'off');
    });
  }
  updateTimerDisplays();
}

function updateCustomTitle(id, category, newName) {
  const item = state[category].find(x => x.id === id);
  if (item) {
    item.name = newName || 'Custom Event';
    saveState();
  }
}

function updatePeriodicOffset(id, valStr) {
  const item = state.periodic.find(x => x.id === id);
  if (!item) return;

  let parsed = parseTimeToSeconds(valStr);
  if (parsed === null) {
    const defItem = defaultPeriodic.find(d => d.id === id);
    parsed = defItem ? defItem.offsetSec : 0;
  }

  item.offsetSec = parsed;
  saveState();
  const input = document.getElementById(`input-offset-${id}`);
  if (input) input.value = secondsToHms(item.offsetSec);
  updateTimerDisplays();
}

function updatePeriodicInterval(id, valStr) {
  const item = state.periodic.find(x => x.id === id);
  if (!item) return;

  let parsed = parseTimeToSeconds(valStr);
  if (parsed === null || parsed <= 0) {
    parsed = 900; // 15 minutes default
  }

  item.type = parsed;
  saveState();
  const input = document.getElementById(`input-interval-${id}`);
  if (input) input.value = secondsToHms(item.type);
  updateTimerDisplays();
}

function editCountdown(id, valStr) {
  const item = state.countdowns.find(x => x.id === id);
  if (!item) return;

  let parsed = parseTimeToSeconds(valStr);
  
  // If deleted or cleared, revert to default timing for this reminder
  if (parsed === null) {
    const defItem = defaultCountdowns.find(d => d.id === id);
    parsed = defItem ? defItem.totalSec : (item.totalSec || 3600);
  }

  item.remainingSec = parsed;
  item.totalSec = parsed;
  item.lastEdit = Date.now();
  saveState();

  const input = document.getElementById(`input-edit-${id}`);
  if (input) input.value = secondsToHms(item.remainingSec);

  updateTimerDisplays();
}

// Delete Confirmation
let deleteTarget = null;
function promptDelete(id, category, name) {
  deleteTarget = { id, category };
  document.getElementById('deleteModalText').textContent = `Are you sure you want to delete "${name}"?`;
  document.getElementById('deleteModal').style.display = 'flex';
}

function closeDeleteModal() {
  deleteTarget = null;
  document.getElementById('deleteModal').style.display = 'none';
}

function confirmDelete() {
  if (!deleteTarget) return;
  const { id, category } = deleteTarget;
  state[category] = state[category].filter(x => x.id !== id);
  saveState();
  closeDeleteModal();
  renderCards();
}

// Custom Item Creation
function addCustomPeriodicFromCard() {
  state.periodic.push({
    id: 'custom_' + Date.now(),
    name: 'New Custom Event',
    type: 900,
    offsetSec: 0,
    mode: 'off',
    soundId: 'chime',
    lastTrigger: 0,
    isCustom: true
  });
  saveState();
  renderCards();
}

function addCustomCountdownFromCard() {
  state.countdowns.push({
    id: 'custom_' + Date.now(),
    name: 'New Custom Countdown',
    totalSec: 3600,
    remainingSec: 3600,
    lastEdit: Date.now(),
    isPaused: true,
    mode: 'off',
    soundId: 'chime',
    isCustom: true
  });
  saveState();
  renderCards();
}

        ${item.isCustom ? `<button class="btn-delete" title="Delete Reminder" onclick="promptDelete('${item.id}', 'periodic', '${item.name.replace(/'/g, "\\'")}')">🗑️</button>` : ''}

        <input type="text" id="input-interval-${item.id}" value="${secondsToHms(item.type)}" onchange="updatePeriodicInterval('${item.id}', this.value)" placeholder="00h 15m 00s">
      </div>`}
      <div class="timer-display" id="display-${item.id}">--:--:--</div>

        <label>Alert Mode</label>

          <button class="mode-btn ${item.mode === 'sound' ? 'active' : ''}" data-mode="sound" onclick="setMode('${item.id}', 'periodic', 'sound')">SOUND</button>
          <button class="mode-btn ${item.mode === 'push' ? 'active' : ''}" data-mode="push" onclick="setMode('${item.id}', 'periodic', 'push')">PUSH</button>

        </div>

          <select onchange="updatePeriodic('${item.id}', 'soundId', this.value)">
            <option value="chime" ${item.soundId === 'chime' ? 'selected' : ''}>Chime</option>

            <option value="pulse" ${item.soundId === 'pulse' ? 'selected' : ''}>Pulse</option>
          </select>
        </div>
      </div>
    `;

  pCreateCard.onclick = addCustomPeriodicFromCard;

    <div class="plus-icon">+</div>

  `;

  const cContainer = document.getElementById('countdown-container');

  state.countdowns.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${item.id}`;
    card.innerHTML = `
      <div class="card-header">
        <div class="icon-placeholder">⏳</div>
        ${item.isCustom ? 
          `<input type="text" class="title-input" value="${item.name.replace(/"/g, '&quot;')}" onchange="updateCustomTitle('${item.id}', 'countdowns', this.value)">` : 
          `<div class="card-title">${item.name}</div>`}
        ${item.isCustom ? `<button class="btn-delete" title="Delete Reminder" onclick="promptDelete('${item.id}', 'countdowns', '${item.name.replace(/'/g, "\\'")}')">🗑️</button>` : ''}
      </div>
      <div class="timer-display" id="display-${item.id}">--:--:--</div>
      <div class="field">
        <label>Alert Mode</label>
        <div class="mode-group" id="mode-group-${item.id}">
          <button class="mode-btn ${item.mode === 'off' ? 'active mode-off' : ''}" data-mode="off" onclick="setMode('${item.id}', 'countdowns', 'off')">OFF</button>
          <button class="mode-btn ${item.mode === 'sound' ? 'active' : ''}" data-mode="sound" onclick="setMode('${item.id}', 'countdowns', 'sound')">SOUND</button>
          <button class="mode-btn ${item.mode === 'push' ? 'active' : ''}" data-mode="push" onclick="setMode('${item.id}', 'countdowns', 'push')">PUSH</button>

        <div class="field">
          <label>Sound</label>
          <select onchange="updateCountdown('${item.id}', 'soundId', this.value)">

            <option value="alarm" ${item.soundId === 'alarm' ? 'selected' : ''}>Alarm</option>

        </div>
      </div>
    `;

  });

  const cCreateCard = document.createElement('div');
  cCreateCard.className = 'card create-card';

function updatePeriodic(id, prop, val) {
  const item = state.periodic.find(x => x.id === id);
  if (item) item[prop] = val;
  saveState();
}

function updateCountdown(id, prop, val) {
  const item = state.countdowns.find(x => x.id === id);
  if (item) item[prop] = val;
  saveState();
}

function togglePauseCountdown(id) {
  const item = state.countdowns.find(x => x.id === id);
  if (!item) return;

  if (!item.isPaused) {
    const elapsed = Math.floor((Date.now() - item.lastEdit) / 1000);
    item.remainingSec = Math.max(0, item.remainingSec - elapsed);
    item.isPaused = true;
  } else {
    const elapsed = item.isPaused ? 0 : Math.floor((Date.now() - item.lastEdit) / 1000);
    const rem = Math.max(0, item.remainingSec - elapsed);

    if (rem <= 0 || item.remainingSec <= 0) {
      item.remainingSec = item.totalSec;
      const input = document.getElementById(`input-edit-${id}`);
      if (input) input.value = secondsToHms(item.remainingSec);
    }

    if (item.mode === 'off') {
      setMode(id, 'countdowns', 'sound');
    }

    item.lastEdit = Date.now();
    item.isPaused = false;
  }

  saveState();
  const btn = document.getElementById(`btn-pause-${id}`);
  if (btn) btn.textContent = item.isPaused ? 'Start/Resume' : 'Pause';
  updateTimerDisplays();
}

function resetCountdown(id) {
  const item = state.countdowns.find(x => x.id === id);
  if (!item) return;

  // Reset to initial default total duration
  const defItem = defaultCountdowns.find(d => d.id === id);
  item.totalSec = defItem ? defItem.totalSec : (item.totalSec || 3600);
  item.remainingSec = item.totalSec;
  item.lastEdit = Date.now();
  item.isPaused = true;
  saveState();

  const btn = document.getElementById(`btn-pause-${id}`);
  if (btn) btn.textContent = 'Start/Resume';
  
  const input = document.getElementById(`input-edit-${id}`);
  if (input) input.value = secondsToHms(item.remainingSec);

  updateTimerDisplays();
}

// 1-Second Timer Tick Engine
function updateTimerDisplays() {
  const now = Date.now();

  // Periodic Reminders Process
  state.periodic.forEach(item => {
    const el = document.getElementById(`display-${item.id}`);
    const card = document.getElementById(`card-${item.id}`);
    if (!el || !card) return;

    const { E, A, A_next } = getPeriodicTargetAndDiff(item, now);

    if (now >= A && item.lastTrigger < E) {
      item.lastTrigger = E;
      saveState();
      triggerAlert(item, `Event Starting Now!`);
    }

    const diff = item.lastTrigger >= E ? A_next - now : A - now;
    el.textContent = formatTime(diff);

    // Apply entire card color filter tinting
    if (item.mode === 'off') {
      card.classList.add('off');
    } else {
      card.classList.remove('off');
    }
  });

  // Countdown Reminders Process
  state.countdowns.forEach(item => {
    const el = document.getElementById(`display-${item.id}`);
    const card = document.getElementById(`card-${item.id}`);
    if (!el || !card) return;

    let rem = item.remainingSec;
    
    if (!item.isPaused) {
      const elapsed = Math.floor((now - item.lastEdit) / 1000);
      rem = Math.max(0, item.remainingSec - elapsed);
      if (rem === 0 && item.remainingSec > 0) {
        item.remainingSec = 0;
        item.isPaused = true;
        triggerAlert(item, `Timer Finished!`);
        saveState();
        
        const btn = document.getElementById(`btn-pause-${item.id}`);
        if (btn) btn.textContent = 'Start/Resume';
      }
    }

    el.textContent = formatTime(rem * 1000);
    
    // Apply card styling states
    if (item.mode === 'off') {
      card.classList.add('off');
      card.classList.remove('expired');
    } else {
      card.classList.remove('off');
      if (rem === 0) {
        card.classList.add('expired');
      } else {
        card.classList.remove('expired');
      }
    }
  });
}

// Initial Run
syncPeriodicOnLoad();
checkOfflineCountdownsOnLoad();
renderCards();
renderLogs();
setInterval(updateTimerDisplays, 1000);
</script>
